[package]
name = "demoncoder"
version = "0.1.2"
edition = "2024"
rust-version = "1.95"
description = "A small Rust terminal coding assistant"
publish = false

[dependencies]
anyhow = "1"
async-trait = "0.1"
clap = { version = "4", features = ["derive"] }
crossterm = { version = "0.29", features = ["event-stream", "osc52"] }
futures-util = "0.3"
ratatui = { version = "0.30", features = ["unstable-rendered-line-info"] }
reqwest = { version = "0.12.28", default-features = false, features = ["json", "stream", "rustls-tls"] }
rustix = { version = "1.1.4", features = ["fs", "process", "pipe", "stdio"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "process", "io-util", "signal", "fs", "net", "io-std"] }
toml = "0.8"
tempfile = "3"
unicode-width = "0.2"
unicode-segmentation = "1.13.3"
syntect = { version = "5.3", default-features = false, features = ["default-fancy"] }
seccompiler = "0.5.0"
libc = "0.2"
ignore = "0.4.33"
notify = "8.2"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
